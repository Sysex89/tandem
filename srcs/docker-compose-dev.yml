services:

  frontend:
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile.dev
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    image: tandem-frontend
    container_name: frontend
    restart: always
    volumes:
      - ./requirements/frontend:/app
      - frontend_node_modules:/app/node_modules # Protect container-specific libs
      - frontend_nuxt_hidden:/app/.nuxt
      - frontend_output_hidden:/app/.output

    networks:
      - transcendence   # Connect to 'notes' and 'postgres' [cite: 21]
    environment:
      - NOTES_ADDR=${NOTES_ADDR}  # Internal SSR communication 
      - NODE_ENV=development
      - HOME=/tmp      # Fix for Corepack/pnpm permission issues
      - HOST=0.0.0.0  # For nuxt, so it knows
      - PORT=${AUTH_PORT}   # For nuxt, so it knows
    depends_on:
      - auth
  
  notes:
    build:
      context: ./requirements/notes
      dockerfile: Dockerfile
    image: tandem-notes
    container_name: notes
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

  editor:
      build:
        context: ./requirements/editor
        dockerfile: Dockerfile
      image: tandem-editor
      container_name: editor
      restart: always
      environment:
        DB_HOST: postgres
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - transcendence

  auth:
    build:
      context: ./requirements/auth
      dockerfile: Dockerfile.dev
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    image: tandem-auth
    container_name: auth
    volumes:
      - ./requirements/auth:/app
      - auth_node_modules:/app/node_modules
      - ./secrets/auth_db_password:/run/secrets/auth_db_password:ro
      - ./secrets/github_client_secret:/run/secrets/github_client_secret:ro
      - ./secrets/session_secret_key:/run/secrets/session_secret_key:ro
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD} # now in secrets
      POSTGRES_ADDR: ${POSTGRES_ADDR}
      HOME: /tmp    
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      WEBSITE_URL: ${WEBSITE_URL}
    # secrets:
    #   - auth_db_password #chosen by myceleum
    #   - github_client_secret # generated by github
    #   - session_secret_key # Shared secret for cookie encryption
    #   # - AUTH_DB_URL=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@${POSTGRES}/${AUTH_DB_NAME} 

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: tandem-nginx
    container_name: nginx
    restart: always
    networks:
      - transcendence
    ports:
      - "8443:443"
    depends_on:
      - frontend
      - auth
      - notes
      - editor


  postgres:
    build: ./requirements/postgres
    image: tandem-postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    secrets:
      - auth_db_password
      - monitoring_db_password
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker and expects the volume here
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - transcendence
    
  grafana:
    build: 
      context: ./requirements/grafana
      dockerfile: Dockerfile
    image: tandem-grafana
    container_name: grafana
    restart: always
    depends_on:
      - prometheus
    secrets:
    - grafana_admin_user
    - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - transcendence
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview.json
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SERVER_ROOT_URL=${WEBSITE_URL}/grafana/  # must match the public origin (incl. port) or Grafana Live rejects the WebSocket
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
  prometheus:
    build:
      context: ./requirements/prometheus
      dockerfile: Dockerfile
    image: tandem-prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ./requirements/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - transcendence
  nginx-exporter:
    build: ./requirements/nginx-exporter
    container_name: nginx-exporter
    restart: always
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    depends_on:
      - nginx
    networks:
      - transcendence
  postgres-exporter:
    build: ./requirements/postgres-exporter
    container_name: postgres-exporter
    restart: always
    environment:
      # Read-only `monitoring` role (pg_monitor), created by postgres/init/03-monitoring.sh
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME}?sslmode=disable"
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS_FILE: /run/secrets/monitoring_db_password
    secrets:
      - monitoring_db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

volumes:
  frontend_node_modules:  # Persistent volume for frontend dependencies
  frontend_nuxt_hidden:   # Persistent volume for frontend nuxt build
  frontend_output_hidden: # Persistent volume for frontend output
  frontend_manual_node_modules:  # Persistent volume for frontend dependencies
  auth_node_modules:      # Persistent volume for auth dependencies
  # One volume per Postgres major version: data files cannot be opened by a different
  # major, so `make upgrade-postgres` dumps the old volume (mycelium_db, Postgres 16)
  # and restores it here, leaving the old one untouched as a backup.
  postgres_data:
    name: tandem_pg18
  # Kept from before the rename to Tandem: renaming a volume creates a new, empty one.
  prometheus_data:
    name: mycelium_prometheus
  grafana_data:
    name: mycelium_grafana



secrets:
  auth_db_password:
    file: ./secrets/auth_db_password # This file contains your secret
  github_client_secret:
    file: ./secrets/github_client_secret #
  session_secret_key:  
    file: ./secrets/session_secret_key
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  monitoring_db_password:
    file: ./secrets/monitoring_db_password

networks:
  transcendence:
    driver: bridge
