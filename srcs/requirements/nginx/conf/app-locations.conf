# Public routes: the 502 page, the editor WebSocket and the frontend. Shared by the
# local HTTPS server here and the plain-HTTP server behind Caddy in production
# (deploy/nginx.conf). The API routes are in api-locations.conf.
error_page 502 /502.html;
proxy_intercept_errors on;
location = /502.html {
	root /var/www/html;
	internal;
}

location /ws/ {
	set $editor_upstream editor:3004;
	# proxy_intercept_errors off;

	auth_request /api/auth/verify;

	# used the same logic as in api/notes, but kept lightweight until we add roles and permissions
	auth_request_set $auth_user_id $upstream_http_x_user_id;
	proxy_set_header X-User-Id $auth_user_id;

	proxy_pass http://$editor_upstream;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	
	# nginx has a standard 60s second timer, that kills the connection 
	# if no bytes are being send/recieved -> up the timer
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
}

# Frontend server
location / {
	set $frontend_upstream frontend:3000;
	proxy_pass http://$frontend_upstream;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection 'upgrade';
	proxy_set_header Host $host;
	proxy_cache_bypass $http_upgrade;
}
