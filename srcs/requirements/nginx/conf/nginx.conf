# Prometheus exporter scrapes this from the nginx-exporter container; 8088 is not published on the host.
server {
    listen 8088;

    location /stub_status {
        stub_status;
        access_log off;
    }
}

# Internal plain-HTTP listener for server-side rendering. The frontend calls the
# API through here so auth_request still runs, without needing to trust the
# self-signed certificate. Not published on the host.
server {
	listen 8081;
	server_name nginx;

	resolver 127.0.0.11 valid=10s;

	include /etc/nginx/snippets/api-locations.conf;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name localhost;

	ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	resolver 127.0.0.11 valid=10s;

	include /etc/nginx/snippets/api-locations.conf;
	include /etc/nginx/snippets/app-locations.conf;

	location = /grafana {
		return 301 /grafana/;
	}

	location /grafana/ {
		proxy_pass http://grafana:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Prefix /grafana;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}