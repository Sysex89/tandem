global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: nginx_exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: notes
    static_configs:
      - targets: ["notes:3003"]
  - job_name: auth
    static_configs:
      - targets: ["auth:3000"]
  - job_name: editor
    static_configs:
      - targets: ["editor:3004"]