services:

  frontend:
    build:
      context: ./requirements/frontend
      dockerfile: Dockerfile
    image: mycelium-frontend
    container_name: frontend
    restart: always
    networks:
      - transcendence
    environment:
      - NOTES_ADDR=${NOTES_ADDR}  # Internal SSR communication
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${AUTH_PORT}
    depends_on:
      - auth
  
  notes:
    build:
      context: ./requirements/notes
      dockerfile: Dockerfile
    image: mycelium-notes
    container_name: notes
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

  editor:
      build:
        context: ./requirements/editor
        dockerfile: Dockerfile
      image: mycelium-editor
      container_name: editor
      restart: always
      environment:
        DB_HOST: postgres
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - transcendence

  auth:
    build:
      context: ./requirements/auth
      dockerfile: Dockerfile
    image: mycelium-auth
    container_name: auth
    volumes:
      - ./secrets/auth_db_password:/run/secrets/auth_db_password:ro
      - ./secrets/github_client_secret:/run/secrets/github_client_secret:ro
      - ./secrets/session_secret_key:/run/secrets/session_secret_key:ro
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD} # now in secrets
      POSTGRES_ADDR: ${POSTGRES_ADDR}
      HOME: /tmp    
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      WEBSITE_URL: ${WEBSITE_URL}
    # secrets:
    #   - auth_db_password #chosen by myceleum
    #   - github_client_secret # generated by github
    #   - session_secret_key # Shared secret for cookie encryption
    #   # - AUTH_DB_URL=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@${POSTGRES}/${AUTH_DB_NAME} 

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: mycelium-nginx
    container_name: nginx
    restart: always
    networks:
      - transcendence
    ports:
      - "8443:443"
    depends_on:
      - frontend
      - auth
      - notes
      - editor


  postgres:
    build: ./requirements/postgres
    image: mycelium-postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      # AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
    secrets:
      - auth_db_password
      - monitoring_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - transcendence
    
  grafana:
    build: 
      context: ./requirements/grafana
      dockerfile: Dockerfile
    image: mycelium-grafana
    container_name: grafana
    restart: always
    depends_on:
      - prometheus
    secrets:
    - grafana_admin_user
    - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - transcendence
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview.json
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
  prometheus:
    build:
      context: ./requirements/prometheus
      dockerfile: Dockerfile
    image: mycelium-prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ./requirements/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - transcendence
  nginx-exporter:
    build: ./requirements/nginx-exporter
    container_name: nginx-exporter
    restart: always
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    depends_on:
      - nginx
    networks:
      - transcendence
  postgres-exporter:
    build: ./requirements/postgres-exporter
    container_name: postgres-exporter
    restart: always
    environment:
      # Read-only `monitoring` role (pg_monitor), created by postgres/init/03-monitoring.sh
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME}?sslmode=disable"
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS_FILE: /run/secrets/monitoring_db_password
    secrets:
      - monitoring_db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence

volumes:
  postgres_data:
    name: mycelium_db
  prometheus_data:
    name: mycelium_prometheus
  grafana_data:
    name: mycelium_grafana


secrets:
  auth_db_password:
    file: ./secrets/auth_db_password # This file contains your secret
  github_client_secret:
    file: ./secrets/github_client_secret #
  session_secret_key:  
    file: ./secrets/session_secret_key
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  monitoring_db_password:
    file: ./secrets/monitoring_db_password

networks:
  transcendence:
    driver: bridge
