name: Images

# Builds the production images and pushes them to GHCR for the hosted demo
# (deploy/docker-compose.yml pulls them), tagged with the commit SHA and latest.
on:
  push:
    branches: [main]
    paths: ["srcs/requirements/**", ".github/workflows/images.yml"]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, auth, notes, editor, nginx, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: srcs/requirements/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/sysex89/tandem-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/sysex89/tandem-${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
