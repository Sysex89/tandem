name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notes, editor]
    defaults:
      run:
        working-directory: srcs/requirements/${{ matrix.service }}
    # notes API tests: #[sqlx::test] creates a throwaway database per test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: srcs/requirements/${{ matrix.service }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  auth:
    name: Auth (build + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/requirements/auth
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_DB_USER: auth
      AUTH_DB_NAME: auth
      POSTGRES_ADDR: localhost:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # src/db/connections.ts reads the password from secrets/ when not running in Docker.
      - run: mkdir -p secrets && printf 'ci-password' > secrets/auth_db_password
      - run: pnpm test --run

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/requirements/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  infra:
    name: Compose + nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Also exercises the demo setup script.
      - run: ./scripts/demo-setup.sh
      - run: docker compose -f srcs/docker-compose.yml config --quiet
      - run: docker compose -f srcs/docker-compose-dev.yml config --quiet
      - name: nginx -t
        run: |
          docker build -q -t ci-nginx srcs/requirements/nginx
          # grafana is proxied without a variable, so nginx resolves it at startup.
          docker run --rm --add-host grafana:127.0.0.1 ci-nginx nginx -t

  e2e:
    name: End-to-end (full stack)
    runs-on: ubuntu-latest
    needs: [infra]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # exposes the cache token that the type=gha cache backend needs
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build the slow images with a per-service layer cache
        run: |
          for s in auth frontend notes editor; do
            docker buildx build --load -t "tandem-$s" \
              --cache-from "type=gha,scope=$s" \
              --cache-to "type=gha,scope=$s,mode=max" \
              "srcs/requirements/$s"
          done
      - name: Start the demo stack
        run: |
          ./scripts/demo-setup.sh
          # The small images are cheap to build; --pull never guarantees nothing
          # is ever substituted from Docker Hub.
          docker compose -f srcs/docker-compose.yml build nginx postgres grafana prometheus nginx-exporter postgres-exporter
          docker compose -f srcs/docker-compose.yml up -d --pull never
          ./scripts/demo-seed.sh
      - name: postgres-exporter reads Postgres as the monitoring role
        run: |
          for i in $(seq 1 15); do
            docker run --rm --network srcs_transcendence curlimages/curl -s http://postgres-exporter:9187/metrics \
              | grep -q '^pg_up 1' && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run tests
        working-directory: tests/e2e
        run: pnpm exec playwright test
      - name: Editor metrics reach Prometheus and the Grafana dashboard loads
        run: |
          curl_net() { docker run --rm --network srcs_transcendence curlimages/curl -sf "$@"; }
          # the e2e run above generated editor traffic; give Prometheus a scrape or two
          for i in $(seq 1 10); do
            curl_net -G http://prometheus:9090/api/v1/query \
              --data-urlencode 'query=sum(editor_messages_total{job="editor"}) > 0' \
              | grep -q '"value"' && break
            [ "$i" = 10 ] && { echo "no editor metrics in Prometheus"; exit 1; }
            sleep 3
          done
          curl_net -u "$(cat srcs/secrets/grafana_admin_user):$(cat srcs/secrets/grafana_admin_password)" \
            http://grafana:3000/grafana/api/dashboards/uid/editor-metrics | grep -q '"uid":"editor-metrics"'
      - name: Service logs
        if: failure()
        run: docker compose -f srcs/docker-compose.yml logs --no-color > e2e-service-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            e2e-service-logs.txt
