version: 2

# Weekly checks; minor and patch bumps are grouped into one PR per ecosystem,
# major bumps arrive as individual PRs.
updates:
  - package-ecosystem: cargo
    directories: ["/srcs/requirements/notes", "/srcs/requirements/editor"]
    schedule: { interval: weekly }
    groups:
      rust-minor-patch: { update-types: [minor, patch] }
    ignore:
      # y-sync 0.4 is tied to yrs 0.17; newer yrs moves the sync protocol into yrs::sync,
      # so upgrading means porting editor/src/sync.rs. Remove this when doing that.
      - dependency-name: yrs
      - dependency-name: y-sync

  - package-ecosystem: npm # also handles pnpm lockfiles
    directories: ["/srcs/requirements/auth", "/srcs/requirements/frontend", "/tests/e2e", "/tests/load"]
    schedule: { interval: weekly }
    groups:
      js-minor-patch: { update-types: [minor, patch] }
    ignore:
      # TypeScript 7 (the native compiler) is not supported by vue-tsc yet; revisit when it is
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /srcs/requirements/auth
      - /srcs/requirements/editor
      - /srcs/requirements/frontend
      - /srcs/requirements/grafana
      - /srcs/requirements/nginx
      - /srcs/requirements/nginx-exporter
      - /srcs/requirements/notes
      - /srcs/requirements/postgres
      - /srcs/requirements/postgres-exporter
      - /srcs/requirements/prometheus
    schedule: { interval: weekly }
    groups:
      docker-minor-patch: { update-types: [minor, patch] }
    ignore:
      # Stay on Node LTS releases (even majors); odd majors get ~6 months of support.
      # Move to the next LTS by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # A major Postgres version cannot open the previous one's data files; upgrading
      # needs a new volume and a dump and restore (see scripts/upgrade-postgres.sh),
      # so it is done by hand.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
