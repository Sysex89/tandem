# Production nginx config for the hosted demo, mounted over the image's nginx.conf.
# Caddy terminates TLS and forwards plain HTTP here; the routes are the same
# snippets as the local HTTPS server, minus Grafana (not deployed).

# Internal plain-HTTP listener for server-side rendering (see srcs/.../nginx.conf).
server {
	listen 8081;
	server_name nginx;

	resolver 127.0.0.11 valid=10s;

	include /etc/nginx/snippets/api-locations.conf;
}

server {
	listen 80;
	server_name _;

	# Client addresses come from Caddy's X-Forwarded-For (sessions record them).
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	client_max_body_size 2m;

	resolver 127.0.0.11 valid=10s;

	include /etc/nginx/snippets/api-locations.conf;
	include /etc/nginx/snippets/app-locations.conf;
}
